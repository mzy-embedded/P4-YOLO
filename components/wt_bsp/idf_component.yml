dependencies:
  idf:
    version: ">=6.0.0"
  # 注意: 这里【故意不写 rules】, 让它无条件下载。
  # 原写法 rules: $CONFIG{WT_BSP_ENABLE_BUTTON} == True 会在首遍 cmake 配置时
  # 求值, 而那时 CONFIG_WT_BSP_ENABLE_BUTTON 尚未生成 -> 组件被判为
  # "Skipping optional dependency: espressif/button" 不下载, 但 wt_bsp 的
  # REQUIRES 已经要它, 于是编译期直接
  #   wt_bsp_button_port.h:21: fatal error: iot_button.h: No such file or directory
  # 与 main/idf_component.yml 对 esp-dl / coco_detect 的处理同理。
  button:
    version: "^4.1.6"
    require: public
  led_strip:
    version: "^3.0.3"
    require: public
    rules:
      - if: "$CONFIG{WT_BSP_ENABLE_RGB} == True"
  esp_lcd_ek79007:
    version: "1.*"
    rules:
      - if: "target == esp32p4 && $CONFIG{WT_BSP_ENABLE_DSI} == True"
  espressif/esp_lcd_ili9881c:
    version: "1.*"
    rules:
      - if: "target == esp32p4 && $CONFIG{WT_BSP_ENABLE_DSI} == True"
  kevincoooool/esp_lcd_st7102:
    version: "1.*"
    rules:
      - if: "target == esp32p4 && $CONFIG{WT_BSP_ENABLE_DSI} == True"
  espressif/esp_lcd_touch:
    version: "*"
    require: public
    rules:
      - if: "target == esp32p4 && $CONFIG{WT_BSP_ENABLE_TOUCH} == True"
  espressif/esp_lcd_touch_st7123:
    version: "1.*"
    rules:
      - if: "target == esp32p4 && $CONFIG{WT_BSP_ENABLE_TOUCH} == True"
  esp_lvgl_port:
    version: "^2"
    require: public
    rules:
      - if: "target == esp32p4 && ($CONFIG{WT_BSP_ENABLE_DSI} == True || $CONFIG{WT_BSP_ENABLE_TOUCH} == True)"
  lvgl/lvgl:
    version: ">=9"
    require: public
    rules:
      - if: "target == esp32p4 && ($CONFIG{WT_BSP_ENABLE_DSI} == True || $CONFIG{WT_BSP_ENABLE_TOUCH} == True)"
  espressif/esp_video:
    version: "2.3.*"
    rules:
      - if: "(target == esp32p4 && $CONFIG{WT_BSP_ENABLE_CSI} == True) || (target == esp32s31 && $CONFIG{WT_BSP_ENABLE_USB_DEVICE_UVC} == True)"
  espressif/esp_cam_sensor:
    version: "2.3.*"
    rules:
      - if: "(target == esp32p4 && $CONFIG{WT_BSP_ENABLE_CSI} == True) || (target == esp32s31 && $CONFIG{WT_BSP_ENABLE_USB_DEVICE_UVC} == True)"
  espressif/esp_sccb_intf:
    version: "*"
    rules:
      - if: "target == esp32p4 && $CONFIG{WT_BSP_ENABLE_CSI} == True"
  espressif/esp_ipa:
    version: "2.2.*"
    rules:
      - if: "target == esp32p4 && $CONFIG{WT_BSP_ENABLE_CSI} == True"
  espressif/usb_device_uvc:
    version: "1.3.*"
    rules:
      - if: "target in [esp32p4, esp32s31] && $CONFIG{WT_BSP_ENABLE_USB_DEVICE_UVC} == True"
  espressif/tinyusb:
    # The S31 bulk completion adapter uses this driver's private state.
    version: "0.19.*"
    rules:
      - if: "target == esp32s31 && $CONFIG{WT_BSP_ENABLE_USB_DEVICE_UVC} == True"
  espressif/esp_tinyusb:
    version: "2.2.*"
    rules:
      - if: "target in [esp32p4, esp32s31] && $CONFIG{WT_BSP_ENABLE_USB_DEVICE_UVC} == False && $CONFIG{WT_BSP_ENABLE_USB_DEVICE_CDC} == True"
